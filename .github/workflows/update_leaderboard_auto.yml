name: Auto Update Leaderboard

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-leaderboard:
    if: github.event.label.name == 'approved-submission'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install pandas
          
      - name: Get PR details
        id: pr-details
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            
            // Get comments on the PR
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number
            });
            
            // Find the evaluation comment (posted by github-actions bot)
            const evalComment = comments.data.find(c => 
              c.user.login === 'github-actions[bot]' && 
              c.body.includes('Submission Evaluation Results')
            );
            
            if (!evalComment) {
              core.setFailed('Could not find evaluation comment');
              return;
            }
            
            // Extract data from comment using regex
            const body = evalComment.body;
            
            const teamMatch = body.match(/\*\*Team\*\*\s*\|\s*(.+?)\s*\|/);
            const runMatch = body.match(/\*\*Run ID\*\*\s*\|\s*(.+?)\s*\|/);
            const modelMatch = body.match(/\*\*Model Type\*\*\s*\|\s*(.+?)\s*\|/);
            const llmMatch = body.match(/\*\*LLM Used\*\*\s*\|\s*(.+?)\s*\|/);
            const scoreMatch = body.match(/\*\*ROC-AUC Score\*\*\s*\|\s*\*\*(.+?)\*\*\s*\|/);
            const notesMatch = body.match(/\*\*Notes:\*\*\s*(.+?)(?:\n|$)/);
            
            if (!teamMatch || !scoreMatch) {
              core.setFailed('Could not extract required data from comment');
              return;
            }
            
            const submission = {
              team: teamMatch[1].trim(),
              run_id: runMatch ? runMatch[1].trim() : 'unknown',
              model: modelMatch ? modelMatch[1].trim() : 'unknown',
              llm_name: llmMatch ? llmMatch[1].trim() : 'none',
              score: parseFloat(scoreMatch[1].trim()),
              notes: notesMatch ? notesMatch[1].trim() : ''
            };
            
            core.setOutput('team', submission.team);
            core.setOutput('run_id', submission.run_id);
            core.setOutput('model', submission.model);
            core.setOutput('llm_name', submission.llm_name);
            core.setOutput('score', submission.score);
            core.setOutput('notes', submission.notes);
            
            console.log('Extracted submission:', submission);
            
      - name: Update leaderboard
        env:
          TEAM: ${{ steps.pr-details.outputs.team }}
          RUN_ID: ${{ steps.pr-details.outputs.run_id }}
          SCORE: ${{ steps.pr-details.outputs.score }}
          MODEL: ${{ steps.pr-details.outputs.model }}
          LLM_NAME: ${{ steps.pr-details.outputs.llm_name }}
          NOTES: ${{ steps.pr-details.outputs.notes }}
        run: |
          python scripts/auto_update_leaderboard.py
          
      - name: Commit and push leaderboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leaderboard/
          git commit -m "Add ${{ steps.pr-details.outputs.team }}/${{ steps.pr-details.outputs.run_id }} to leaderboard (score: ${{ steps.pr-details.outputs.score }})"
          git push origin main
          
      - name: Close PR and comment
        uses: actions/github-script@v7
        with:
          script: |
            const team = '${{ steps.pr-details.outputs.team }}';
            const score = '${{ steps.pr-details.outputs.score }}';
            
            // Comment on PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## ✅ Submission Approved!\n\n` +
                    `Your score (**${score}**) has been added to the leaderboard!\n\n` +
                    `🏆 View the leaderboard: [leaderboard.md](../blob/main/leaderboard/leaderboard.md)\n\n` +
                    `This PR will now be closed to keep predictions private.\n\n` +
                    `Thank you for participating! Feel free to submit improvements with a new run_id.`
            });
            
            // Close PR
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: 'closed'
            });