name: Evaluate Encrypted Submission

on:
  pull_request:
    paths:
      - 'submissions/inbox/**/*.enc'
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      # SECURITY: Validate PR only touches submissions folder
      - name: Checkout PR for validation
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: pr-check

      - name: Validate PR only modifies submissions
        run: |
          cd pr-check
          git fetch origin main
          CHANGED=$(git diff --name-only origin/main HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          INVALID=$(echo "$CHANGED" | grep -v "^submissions/inbox/" || true)

          if [ ! -z "$INVALID" ]; then
            echo "❌ ERROR: PR modifies protected files:"
            echo "$INVALID"
            echo ""
            echo "You are only allowed to modify files inside submissions/inbox/"
            exit 1
          fi
          echo "✅ Validation passed - only submission files modified"

      # SECURITY: Checkout evaluation scripts from YOUR main branch ONLY
      - name: Checkout evaluation code from main
        uses: actions/checkout@v3
        with:
          ref: main
          path: evaluation-code
          token: ${{ secrets.GITHUB_TOKEN }}

      # Checkout the PR branch (submission only)
      - name: Checkout submission branch
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: participant-submission
          sparse-checkout: |
            submissions/inbox/
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn cryptography

      # SECURITY: Write private key from GitHub Secret
      - name: Prepare private key
        env:
          PRIVATE_KEY: ${{ secrets.ENCRYPTION_PRIVATE_KEY }}
        run: |
          echo "$PRIVATE_KEY" > /tmp/private_key.pem
          chmod 600 /tmp/private_key.pem

      # Find .enc file and read metadata.json
      - name: Find submission and read metadata
        id: submission
        run: |
          # Find .enc file in submissions/inbox/*/*/
          ENC_FILE=$(find participant-submission/submissions/inbox -name "*.enc" | head -1)

          if [ -z "$ENC_FILE" ]; then
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "error=No .enc file found in submissions/inbox/" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "📁 Found: $ENC_FILE"

          # Extract team from path
          # Path: submissions/inbox/TEAM_NAME/predictions.csv.enc
          TEAM=$(echo "$ENC_FILE" | awk -F'/' '{print $(NF-1)}')

          echo "team=$TEAM" >> $GITHUB_OUTPUT
          echo "enc_file=$ENC_FILE" >> $GITHUB_OUTPUT
          echo "👤 Team: $TEAM"

          # Read metadata.json from same folder
          META_FILE=$(dirname "$ENC_FILE")/metadata.json

          if [ -f "$META_FILE" ]; then
            MODEL=$(python -c "import json; d=json.load(open('$META_FILE')); print(d.get('model','unknown'))")
            LLM=$(python -c "import json; d=json.load(open('$META_FILE')); print(d.get('llm_name','none'))")
            NOTES=$(python -c "import json; d=json.load(open('$META_FILE')); print(d.get('notes',''))")
            echo "model=$MODEL" >> $GITHUB_OUTPUT
            echo "llm_name=$LLM" >> $GITHUB_OUTPUT
            echo "notes=$NOTES" >> $GITHUB_OUTPUT
            echo "✅ Metadata loaded: model=$MODEL, llm=$LLM"
          else
            echo "model=unknown" >> $GITHUB_OUTPUT
            echo "llm_name=none" >> $GITHUB_OUTPUT
            echo "notes=" >> $GITHUB_OUTPUT
            echo "⚠️ No metadata.json found, using defaults"
          fi

      # Decrypt the .enc file
      - name: Decrypt submission
        id: decrypt
        if: steps.submission.outputs.enc_file != ''
        run: |
          python evaluation-code/encryption/decrypt.py \
            "${{ steps.submission.outputs.enc_file }}" \
            /tmp/private_key.pem \
            /tmp/decrypted_predictions.csv

          if [ $? -eq 0 ]; then
            echo "decrypted=true" >> $GITHUB_OUTPUT
            echo "✅ Decryption successful"
          else
            echo "decrypted=false" >> $GITHUB_OUTPUT
            echo "error=Decryption failed. Did you use the correct public_key.pem?" >> $GITHUB_OUTPUT
          fi

      # Copy decrypted predictions into evaluation environment
      - name: Prepare evaluation environment
        if: steps.decrypt.outputs.decrypted == 'true'
        run: |
          TEAM="${{ steps.submission.outputs.team }}"
          mkdir -p evaluation-code/submissions/inbox/$TEAM
          cp /tmp/decrypted_predictions.csv evaluation-code/submissions/inbox/$TEAM/predictions.csv

          # Also copy metadata.json
          META_FILE="participant-submission/submissions/inbox/$TEAM/metadata.json"
          if [ -f "$META_FILE" ]; then
            cp "$META_FILE" evaluation-code/submissions/inbox/$TEAM/metadata.json
          fi

      # DEBUG: Inspect decrypted file
      - name: Debug decrypted file
        if: steps.decrypt.outputs.decrypted == 'true'
        run: |
          echo "=== File size ==="
          wc -c /tmp/decrypted_predictions.csv
          echo "=== First 5 lines ==="
          head -5 /tmp/decrypted_predictions.csv
          echo "=== File encoding ==="
          file /tmp/decrypted_predictions.csv

      # Write test labels from GitHub Secret
      - name: Prepare test labels
        if: steps.decrypt.outputs.decrypted == 'true'
        env:
          TEST_LABELS_CSV: ${{ secrets.TEST_LABELS_CSV }}
        run: |
          echo "$TEST_LABELS_CSV" > evaluation-code/test_labels.csv

      # Run evaluation
      - name: Evaluate submission
        id: evaluate
        if: steps.decrypt.outputs.decrypted == 'true'
        working-directory: evaluation-code
        run: |
          python competition/evaluate_pr.py

      # Read result
      - name: Read result
        id: result
        if: steps.decrypt.outputs.decrypted == 'true'
        working-directory: evaluation-code
        run: |
          if [ -f evaluation_result.json ]; then
            VALID=$(python -c "import json; print(json.load(open('evaluation_result.json'))['valid'])")
            echo "valid=$VALID" >> $GITHUB_OUTPUT

            if [ "$VALID" = "True" ]; then
              SCORE=$(python -c "import json; print(json.load(open('evaluation_result.json'))['roc_auc'])")
              echo "score=$SCORE" >> $GITHUB_OUTPUT
            else
              ERRORS=$(python -c "import json; print(json.load(open('evaluation_result.json')).get('errors','Unknown error'))")
              echo "errors=$ERRORS" >> $GITHUB_OUTPUT
            fi
          fi

      # Update leaderboard automatically
      - name: Update leaderboard
        if: steps.result.outputs.valid == 'True'
        working-directory: evaluation-code
        env:
          TEAM: ${{ steps.submission.outputs.team }}
          RUN_ID: run_001
          SCORE: ${{ steps.result.outputs.score }}
          MODEL: ${{ steps.submission.outputs.model }}
          LLM_NAME: ${{ steps.submission.outputs.llm_name }}
          NOTES: ${{ steps.submission.outputs.notes }}
        run: |
          python scripts/auto_update_leaderboard.py

      - name: Commit and push leaderboard
        if: steps.result.outputs.valid == 'True'
        working-directory: evaluation-code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leaderboard/
          git diff --staged --quiet || git commit -m "Add ${{ steps.submission.outputs.team }}/${{ steps.submission.outputs.run_id }} to leaderboard (score: ${{ steps.result.outputs.score }})"
          git push origin main

      # Write score result back to participant's branch
      - name: Write score back to branch
        working-directory: participant-submission
        run: |
          TEAM="${{ steps.submission.outputs.team }}"
          VALID="${{ steps.result.outputs.valid }}"
          SCORE="${{ steps.result.outputs.score }}"
          ERRORS="${{ steps.decrypt.outputs.error }}${{ steps.result.outputs.errors }}"

          mkdir -p submissions/inbox/$TEAM

          if [ "$VALID" = "True" ]; then
            cat > submissions/inbox/$TEAM/score.txt << EOF
          ╔══════════════════════════════════════╗
          ║     BITLINK Evaluation Result        ║
          ╠══════════════════════════════════════╣
          ║ Team   : $TEAM
          ║ Score  : $SCORE (ROC-AUC)
          ║ Status : Valid
          ║ Time   : $(date -u)
          ╚══════════════════════════════════════╝
          Your score has been added to the leaderboard!
          View: https://github.com/Narimaneker/BITLINK/blob/main/leaderboard/leaderboard.md
          EOF
          else
            cat > submissions/inbox/$TEAM/score.txt << EOF
          ╔══════════════════════════════════════╗
          ║     BITLINK Evaluation Result        ║
          ╠══════════════════════════════════════╣
          ║ Team   : $TEAM
          ║ Status : Failed
          ║ Error  : $ERRORS
          ║ Time   : $(date -u)
          ╚══════════════════════════════════════╝
          Please fix the errors and resubmit.
          EOF
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add submissions/inbox/$TEAM/score.txt
          git diff --staged --quiet || git commit -m "Score: $TEAM"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      # SECURITY: Clean up all sensitive files
      - name: Clean up
        if: always()
        run: |
          rm -f /tmp/private_key.pem
          rm -f /tmp/decrypted_predictions.csv
          rm -f evaluation-code/test_labels.csv
          rm -f evaluation-code/evaluation_result.json
          echo "Cleaned up"